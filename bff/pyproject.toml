[project]
name = "bff"
version = "0.1.0"
description = "Pegawai AI backend-for-frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.33",
    "pypdf>=7.1.0",
    "cryptography>=50.0.2",
    "mcp==1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"  # live tests call Hermes (cost tokens): run them with `uv run pytest -m live`
markers = ["live: runs real Hermes runs through a running BFF; skipped by default"]
