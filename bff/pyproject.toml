[project]
name = "bff"
version = "0.1.0"
description = "Pegawai AI backend-for-frontend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
