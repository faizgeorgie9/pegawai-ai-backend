<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorbox Bespoke Lookbook — Day 1</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f14;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      margin: 0;
    }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; color: #f43f5e; }
    .header p { margin: 0; color: #94a3b8; font-size: 14px; }
    .badge { display: inline-block; padding: 4px 14px; background: rgba(244,63,94,0.15); border: 1px solid #f43f5e; border-radius: 20px; font-size: 12px; font-weight: 600; color: #f43f5e; margin-bottom: 10px; }
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 4/5;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      background: #14171f;
    }
    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .slides-wrapper::-webkit-scrollbar { display: none; }
    .slide-item {
      flex: 0 0 100%;
      height: 100%;
      scroll-snap-align: start;
    }
    .slide-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .nav-hints {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">DAY 1 BESPOKE EDITORIAL LOOKBOOK</span>
    <h1>Double Pocket Flared Denim Pants</h1>
    <p>Koleksi resmi LT. GREY — Potongan presisi khas Colorbox • 1080 × 1350 px (4:5 Feed Portrait)</p>
  </div>
  <div class="carousel-container">
    <div class="slides-wrapper">
      <div class="slide-item"><img src="slide_1_cover_hero.png" alt="Slide 1 - Cover Hero"></div>
      <div class="slide-item"><img src="slide_2_hero_top.png" alt="Slide 2 - Craftsmanship & Detail"></div>
      <div class="slide-item"><img src="slide_3_bottom_pairing.png" alt="Slide 3 - Silhouette Pairing"></div>
      <div class="slide-item"><img src="slide_4_accessories_layering.png" alt="Slide 4 - Complete Ensemble"></div>
      <div class="slide-item"><img src="slide_5_outro_cta.png" alt="Slide 5 - Lookbook Outro"></div>
    </div>
  </div>
  <div class="nav-hints">
    <span>👈 Geser / Swipe horizontal 👉</span>
    <span>5 Slides Ready-to-Post</span>
  </div>
</body>
</html>
